services:
  mysql:
    image: mysql:8.4
    container_name: helpdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina a senha no arquivo .env}
      MYSQL_DATABASE: helpdesk_db
    ports:
      - "3306:3306"
    volumes:
      - helpdesk_data:/var/lib/mysql

volumes:
  helpdesk_data: